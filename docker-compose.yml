services:
  postgres:
    image: postgres:16-alpine
    container_name: ordens_servico_postgres
    environment:
      POSTGRES_DB: ordens_servico
      POSTGRES_USER: ordens_user
      POSTGRES_PASSWORD: ordens_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
