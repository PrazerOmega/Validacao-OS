services:
  postgres:
    image: postgres:16-alpine
    container_name: ordens_servico_postgres
    environment:
      POSTGRES_DB: ordens_servico
      POSTGRES_USER: ordens_user
      POSTGRES_PASSWORD: ordens_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: ordens_servico_mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
